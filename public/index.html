<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inner Circle</title>
  <meta name="description" content="Private banking with advice from the people you already know, right before the money moves.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2316213a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23c9aa6b' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23c9aa6b' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a href="#/home" class="brand" aria-label="Inner Circle home">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="16" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Inner Circle</span>
      </a>
      <label class="viewas">
        <span class="viewas-label">Demo: view as</span>
        <select id="viewas" aria-label="Demo: choose which member to view the app as"></select>
      </label>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#/messages" data-tab="messages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Private Line</span><b class="dot" id="msgdot" hidden></b></a>
      <a href="#/pay" data-tab="pay" class="paytab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>Pay</span></a>
      <a href="#/network" data-tab="network"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="17" r="2.5"/><path d="M8 8.5 10.5 15M16 8.5 13.5 15M8.5 7h7"/></svg><span>Network</span></a>
      <a href="#/record" data-tab="record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-5-3-5 3z"/></svg><span>Record</span></a>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="tip" id="tip" role="tooltip" hidden></div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Dossier">
        <div class="sheet-grip"><button class="btn text sheet-close">Close</button></div>
        <div class="sheet-body"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
